<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        body {
            background-color: #E8ECED;
        }

        h1 {
            color: aliceblue;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px 0px 0px 0px;
        }

        h2 {
            color: aliceblue;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        #card {
            background-image: url(images/christus.webp);
            margin: 0 auto;
            max-width: 75%;
            height: 700px;
            border-radius: 40px;
        }

        #bottomgrid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            align-items: center;
            justify-items: center;
            gap: 5px;
            margin: 0% 15% 15% 15%;
        }

        #topgrid {
            display: grid;
            align-items: center;
            grid-template-columns: 1fr 1fr 1fr;
            justify-items: center;

        }

        img {
            width: 120px;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #E8ECED;
        }
    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
     <div id="card">
        <h1>
            First Presidency
        </h1>
        <div id="topgrid">
            <img src="images/eyring.webp" alt="Elder Eyring, part of the First Presidency">
            <img src="images/oaks.webp" alt="President Oaks, part of the First Presidency">
            <img src="images/christofferson.webp" alt="Elder Christofferson, part of the First Presidency">
        </div>
        <h2>
            Quorum of the Twelve Apostles
        </h2>
        <div id="bottomgrid">
            <img src="images/uchtdorf.webp" alt="Elder Christofferson, part of the First Presidency">
            <img src="images/bednar.webp" alt="Elder Christofferson, part of the First Presidency">
            <img src="images/cook.webp" alt="Elder Christofferson, part of the First Presidency">
            <img src="images/anderson.webp" alt="Elder Christofferson, part of the First Presidency">
            <img src="images/rasband.webp" alt="Elder Christofferson, part of the First Presidency">
            <img src="images/stevenson.webp" alt="Elder Christofferson, part of the First Presidency">
            <img src="images/renlund.webp" alt="Elder Christofferson, part of the First Presidency">
            <img src="images/gong.webp" alt="Elder Christofferson, part of the First Presidency">
            <img src="images/soares.webp" alt="Elder Christofferson, part of the First Presidency">
            <img src="images/kearon.webp" alt="Elder Christofferson, part of the First Presidency">
            <img src="images/causse.webp" alt="Elder Christofferson, part of the First Presidency">
            <img src="images/gilbert.webp" alt="Elder Christofferson, part of the First Presidency">
        </div>
     </div>
</body>
</html>
