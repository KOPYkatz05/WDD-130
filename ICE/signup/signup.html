<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: rgb(120, 96, 64);
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            min-height: 100vh;
            width: 100vw; 
            padding: 20px;
        }

        #bigForm {
            display: grid;
            grid-template-rows: 220px 1fr auto;
            height: auto; 
            width: 500px;
            border: 4px solid #0044aa;
            border-radius: 20px;
            overflow: hidden;
            background-color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        #headerForm {
            background-image: url(/ICE/signup/images/jesus_feeds_5000.jpeg);
            background-position: center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        #closeBtn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 10px;
            font-weight: bold;
        }

        h1, h2 {
            color: white;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        #formContainer {
            background-color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #formContainer h3 {
            margin-bottom: 20px;
            text-align: center;
        }

        #myForm {
            width: 100%;
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 15px;
            align-items: center;
        }

        #myForm section {
            grid-column: 1 / -1;
            text-align: center;
        }

        #myForm label {
            text-align: left;
        }

        #myForm .gender-options {
            grid-column: 2;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #myForm i6nput[type="text"], #myForm input[type="password"], #myForm input[type="email"] {
            width: 100%;
            padding: 6px;
            border: 1px solid #999;
            border-radius: 4px;
        }

        #myForm button[type="submit"] {
            padding: 6px 20px;
        }

        #bookImages {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            background-color: #111;
            border-top: 2px solid #555;
            width: 100%;

        }

        #bookImages img {
            width: 100%;
            height: auto;
            display: block;
            border-right: 1px solid #444;
        }

        #bookImages img:last-child {
            border-right: none;
        }

        #output {
            color: white;
            width: 500px;
            margin: 20px 0 0 0;
            text-align: center;
        }

    </style>
</head>
<body>
    <div id="bigForm">
        <div id="headerForm">
            <button type="button" id="closeBtn">X</button>
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </div>
        <div id="formContainer">
            <h3>Sign Up for Daily Scripture Feed</h3>
            <form id="myForm">
                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label>Gender:</label>
                <div class="gender-options">
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female" required>
                    <label for="female">Female</label>
                </div>
                
                <section>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to newsletter</label>
                </section>
                <section>
                    <input type="checkbox" id="conditions" name="conditions" required>
                    <label for="conditions">I acknowledge the terms and conditions</label>
                </section>
                <section>
                    <button type="submit">Submit</button>
                </section>
            </form>
        </div>
        <div id="bookImages">
            <img src="/ICE/signup/images/old_testament.webp" alt="Old Testament">
            <img src="/ICE/signup/images/new_testament.webp" alt="New Testament">
            <img src="/ICE/signup/images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="/ICE/signup/images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img src="/ICE/signup/images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </div>
    </div>
    <div id="output"></div>



    <script>
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("bigForm").style.display = "none";
        });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            const formData = new FormData(form);
            const entries = [];
            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }
            output.innerHTML = `
                <br>
                <h3>Here is the data that would be sent to the server:</h3>
                <ul>
                    ${entries.map(item => `<li>${item}</li>`).join('')}
                </ul>
            `;
        });
    </script>
</body>
</html>
